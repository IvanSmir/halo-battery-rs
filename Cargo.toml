[package]
name = "halo-battery-rs"
version = "0.2.0"
edition = "2024"

[dependencies]
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-winrt-notification = "0.8.1"
tiny-skia = "0.12.0"
tray-icon = "0.25.1"
windows = { version = "0.62.2", features = ["Gaming_Input", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_WinRT", "Devices_Power", "System_Power", "Win32_System_Console", "Win32_Security", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_SystemInformation", "Devices_Bluetooth", "Web_Http", "Web_Http_Headers"] }

[workspace]
members = ["settings"]
# the tray builds fast; the settings window (Tauri) only when asked: -p halo-settings
default-members = ["."]

[lib]
name = "halo_battery"
path = "src/lib.rs"

[[bin]]
name = "halo-battery"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
