name: Build installer

# Builds the installer and the portable zip on demand, without releasing
# them: Actions -> Build installer -> Run workflow. Releases are published by
# the release-please workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        shell: pwsh
        run: ./scripts/release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: halo-battery
          path: dist/*
